[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reeftone"
version = "0.2.0"
description = "A non-destructive, adaptive underwater color-correction studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReefTone contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pillow-heif>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "tifffile>=2025.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
reeftone = "reeftone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reeftone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
